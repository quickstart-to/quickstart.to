<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" role="img" aria-labelledby="title desc">
  <title id="title">周报工具的示例数据边界</title>
  <desc id="desc">CSV 与报告在浏览器内处理和导出，不上传。邮箱进入账号服务，购买信息进入 Creem，付款事件回传账号服务以开通权益。主机与邮件等实际供应商需另列。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b5410c"/></marker></defs>
  <rect width="640" height="600" rx="20" fill="#faf6ee"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#292722">
    <text x="32" y="43" font-size="24">示例设计 · 报告与账号分开处理</text>
    <rect x="24" y="66" width="592" height="184" rx="14" fill="#ffffff" stroke="#66645e" stroke-width="2"/>
    <text x="320" y="106" text-anchor="middle" font-size="30" font-weight="600">用户浏览器</text>
    <text x="320" y="153" text-anchor="middle" font-size="28">CSV → 汇总 → 导出报告</text>
    <text x="320" y="202" text-anchor="middle" font-size="26" fill="#b5410c">文件内容不上传、不存云端历史</text>
    <path d="M160 250V331" fill="none" stroke="#b5410c" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M480 250V331" fill="none" stroke="#b5410c" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="105" y="272" width="110" height="34" fill="#faf6ee"/>
    <rect x="402" y="272" width="156" height="34" fill="#faf6ee"/>
    <text x="160" y="299" text-anchor="middle" font-size="27">邮箱</text>
    <text x="480" y="299" text-anchor="middle" font-size="27">结账信息</text>
    <rect x="24" y="342" width="272" height="131" rx="14" fill="#ffffff" stroke="#66645e" stroke-width="2"/>
    <rect x="344" y="342" width="272" height="131" rx="14" fill="#ffffff" stroke="#66645e" stroke-width="2"/>
    <text x="160" y="386" text-anchor="middle" font-size="30" font-weight="600">账号服务</text>
    <text x="160" y="432" text-anchor="middle" font-size="26">登录 · 订单 · 权益</text>
    <text x="480" y="386" text-anchor="middle" font-size="30" font-weight="600">Creem 结账</text>
    <text x="480" y="432" text-anchor="middle" font-size="26">购买 · 支付处理</text>
    <path d="M480 473V518H160V477" fill="none" stroke="#b5410c" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="194" y="494" width="252" height="40" fill="#faf6ee"/>
    <text x="320" y="522" text-anchor="middle" font-size="27">已验证的付款事件</text>
    <text x="320" y="574" text-anchor="middle" font-size="23">主机、邮件及日志的实际数据流仍须核对</text>
  </g>
</svg>
